<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Criar conta - VM</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><section class="card"><div class="brand">💬</div><h1>Criar conta</h1><p class="subtitle">Entre no VM em poucos segundos</p><div id="message" class="message" hidden></div><form id="registerForm"><label for="name">Seu nome</label><input id="name" type="text" maxlength="80" placeholder="Como você quer aparecer?" autocomplete="name" required><label for="phone">Seu telefone</label><input id="phone" type="tel" inputmode="tel" maxlength="20" placeholder="(11) 99999-9999" autocomplete="tel" required><label for="password">Crie uma senha</label><input id="password" type="password" minlength="8" maxlength="128" placeholder="Mínimo de 8 caracteres" autocomplete="new-password" required><button type="submit">Criar minha conta</button></form><button class="secondary" type="button" onclick="location.href='/'">Já tenho uma conta</button></section></main><script>const form=document.getElementById('registerForm');const message=document.getElementById('message');function show(text,error=false){message.textContent=text;message.className=`message ${error?'error':'success'}`;message.hidden=false}form.addEventListener('submit',async event=>{event.preventDefault();const name=document.getElementById('name').value.trim(),phone=document.getElementById('phone').value.trim(),password=document.getElementById('password').value,button=form.querySelector('button');button.disabled=true;button.textContent='Criando...';try{const response=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({name,phone,password})});const data=await response.json();if(!response.ok)throw new Error(data.error||'Não foi possível criar a conta.');window.location.href='/dashboard.html'}catch(error){show(error.message,true)}finally{button.disabled=false;button.textContent='Criar minha conta'}});</script></body></html>
