<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar conta - Meu E-mail</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section class="card">
      <div class="brand">✉</div>
      <h1>Criar conta</h1>
      <p class="subtitle">Escolha seu endereço de e-mail</p>
      <div id="message" class="message" hidden></div>
      <form id="registerForm">
        <label for="name">Nome</label>
        <input id="name" type="text" maxlength="80" autocomplete="name" required>
        <label for="email">E-mail</label>
        <input id="email" type="email" placeholder="voce@seudominio.com" autocomplete="email" required>
        <label for="password">Senha</label>
        <input id="password" type="password" minlength="8" autocomplete="new-password" required>
        <label for="confirmPassword">Confirmar senha</label>
        <input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required>
        <button type="submit">Criar conta</button>
      </form>
      <button class="secondary" type="button" onclick="location.href='/'">Voltar para entrar</button>
    </section>
  </main>
  <script>
    const form = document.getElementById('registerForm');
    const message = document.getElementById('message');
    function show(text, error = false) {
      message.textContent = text;
      message.className = `message ${error ? 'error' : 'success'}`;
      message.hidden = false;
    }
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      if (password !== confirmPassword) return show('As senhas não conferem.', true);
      const button = form.querySelector('button');
      button.disabled = true;
      button.textContent = 'Criando...';
      try {
        const response = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ name, email, password })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Não foi possível criar a conta.');
        window.location.href = '/dashboard.html';
      } catch (error) {
        show(error.message, true);
      } finally {
        button.disabled = false;
        button.textContent = 'Criar conta';
      }
    });
  </script>
</body>
</html>
