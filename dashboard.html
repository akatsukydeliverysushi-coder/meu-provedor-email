<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>VM</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><section class="card wide webmail"><header class="topbar"><div class="brand">VM</div><div><h1>VM</h1><p class="subtitle" id="accountEmail">Carregando...</p></div><div class="online-pill"><span></span> Online</div></header><div class="chat-layout"><aside class="chat-sidebar"><button id="newChat" class="compose-btn">✏️ Nova conversa</button><input id="userSearch" type="search" placeholder="🔍 Procurar pessoa"><div id="userResults"></div><div class="side-title">Conversas</div><div id="conversations" class="conversation-list"></div><button id="logout" class="secondary logout-btn">Sair</button></aside><section class="chat-main"><div id="emptyChat" class="chat-empty">💬<h2>Suas conversas</h2><p>Escolha uma pessoa para começar a conversar.</p></div><div id="chatPanel" hidden><div class="chat-head"><button id="backBtn" class="secondary">←</button><div><strong id="chatName"></strong><small id="chatEmail"></small></div><span class="chat-status"><i></i> online</span></div><div id="chatMessages" class="chat-messages"></div><form id="chatForm" class="chat-form"><input id="chatText" maxlength="20000" placeholder="Digite uma mensagem..." autocomplete="off" required><button type="submit">➤</button></form></div></section></div></section></main><div id="msnNotice" class="msn-notice" hidden><div class="notice-avatar">VM</div><div class="notice-body"><strong id="noticeName">Nova mensagem</strong><span id="noticeText"></span></div><button id="noticeClose">×</button></div><script>
let currentChat=null,currentUserId=null,lastSeenMessageId=0,noticeTimer=null;const $=id=>document.getElementById(id);function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function api(url,opt={}){opt.credentials='include';const r=await fetch(url,opt);const d=r.status===204?{}:await r.json();if(!r.ok)throw new Error(d.error||'Erro');return d;}
async function init(){try{const d=await api('/api/me');currentUserId=d.user.id;$('accountEmail').textContent=d.user.email;await loadConversations();startNotifications();}catch(e){location.href='/';}}
async function loadConversations(){const d=await api('/api/conversations');$('conversations').innerHTML=d.conversations.length?d.conversations.map(c=>`<button class="conversation" data-email="${esc(c.email)}"><span class="avatar">${esc(c.name.charAt(0).toUpperCase())}</span><span class="conv-info"><strong>${esc(c.name)}</strong><small>${esc(c.body)}</small></span><time>${new Date(c.created_at).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</time></button>`).join(''):'<p class="empty-side">Nenhuma conversa ainda.</p>';}
async function openChat(email){try{const d=await api('/api/conversations/'+encodeURIComponent(email));currentChat=d.user;$('emptyChat').hidden=true;$('chatPanel').hidden=false;$('chatName').textContent=d.user.name;$('chatEmail').textContent=d.user.email;$('chatMessages').innerHTML=d.messages.map(m=>`<div class="bubble ${String(m.sender_id)===String(currentUserId)?'mine':'theirs'}"><div>${esc(m.body)}</div><small>${new Date(m.created_at).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})} ${m.is_read&&String(m.sender_id)===String(currentUserId)?'✓✓':''}</small></div>`).join('');$('chatMessages').scrollTop=$('chatMessages').scrollHeight;await loadConversations();}catch(e){alert(e.message)}}
$('conversations').onclick=e=>{const b=e.target.closest('.conversation');if(b)openChat(b.dataset.email)};
$('newChat').onclick=()=>{$('userSearch').focus();$('userSearch').value='';loadUsers('');};
async function loadUsers(q){try{const d=await api('/api/users?q='+encodeURIComponent(q));$('userResults').innerHTML=d.users.map(u=>`<button class="user-result" data-email="${esc(u.email)}"><span class="avatar">${esc(u.name.charAt(0).toUpperCase())}</span><span><strong>${esc(u.name)}</strong><small>${esc(u.email)}</small></span></button>`).join('');}catch(e){}}
$('userSearch').addEventListener('input',e=>loadUsers(e.target.value));$('userResults').onclick=e=>{const b=e.target.closest('.user-result');if(b){$('userResults').innerHTML='';$('userSearch').value='';openChat(b.dataset.email)}};
$('chatForm').onsubmit=async e=>{e.preventDefault();if(!currentChat)return;const text=$('chatText').value.trim();if(!text)return;try{await api('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({recipient:currentChat.email,subject:'Conversa',body:text})});$('chatText').value='';await openChat(currentChat.email);}catch(err){alert(err.message)}};
$('backBtn').onclick=()=>{$('chatPanel').hidden=true;$('emptyChat').hidden=false;currentChat=null};$('logout').onclick=async()=>{await api('/api/logout',{method:'POST'});location.href='/'};
function playNoticeSound(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C(),o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.setValueAtTime(880,c.currentTime);o.frequency.exponentialRampToValueAtTime(660,c.currentTime+.12);g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(.12,c.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.22);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.24);}catch(e){}}
function showNotice(name,text,email){$('noticeName').textContent=name+' enviou uma mensagem';$('noticeText').textContent=text.length>80?text.slice(0,80)+'…':text;$('msnNotice').hidden=false;clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>{$('msnNotice').hidden=true},6000);playNoticeSound();$('msnNotice').onclick=e=>{if(e.target.id!=='noticeClose')openChat(email)};}
async function checkNotifications(){try{const d=await api('/api/conversations');if(!d.conversations.length)return;const newest=d.conversations[0];const id=Number(newest.message_id||0);if(!lastSeenMessageId){lastSeenMessageId=id;return;}if(id>lastSeenMessageId&&String(newest.sender_id)!==String(currentUserId)){showNotice(newest.name,newest.body,newest.email);if(currentChat&&currentChat.email===newest.email)openChat(newest.email);lastSeenMessageId=id;loadConversations();}}catch(e){}}
function startNotifications(){setInterval(checkNotifications,3000);}
$('noticeClose').onclick=e=>{e.stopPropagation();$('msnNotice').hidden=true};init();</script></body></html>
