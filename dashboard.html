<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>VM</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="mobile.css?v=20260907"><style>.vm-call-buttons{margin-left:auto;display:flex;gap:6px}.vm-call-buttons button,.vm-call-actions button{border:0;border-radius:10px;padding:9px 12px;cursor:pointer;font-size:16px}.vm-call-layer{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:9999;display:flex;align-items:center;justify-content:center}.vm-call-layer[hidden],.vm-incoming[hidden]{display:none!important}.vm-call-box{background:#fff;border-radius:18px;padding:16px;width:min(760px,94vw);box-shadow:0 20px 60px #0008}.vm-call-title{display:flex;justify-content:space-between;align-items:center;font-size:18px;font-weight:700}.vm-call-title button{border:0;background:transparent;font-size:28px;cursor:pointer}.vm-videos{display:flex;gap:10px;margin-top:12px;background:#111;border-radius:14px;padding:8px;min-height:260px}.vm-videos video{width:100%;max-height:55vh;object-fit:contain;border-radius:10px;background:#222}.vm-videos video#vmLocal{max-width:28%;align-self:flex-end}.vm-call-status{text-align:center;padding:12px;font-weight:600}.vm-call-actions{display:flex;justify-content:center;gap:10px}.vm-call-actions button:last-child{background:#d93025;color:#fff}.vm-incoming{position:fixed;right:20px;bottom:20px;z-index:10000;background:#fff;border-radius:16px;padding:18px;box-shadow:0 12px 40px #0005;min-width:260px}.vm-incoming-title{font-weight:700;margin-bottom:8px}.vm-incoming-actions{display:flex;gap:8px;margin-top:12px}.vm-incoming-actions button{flex:1;padding:10px;border:0;border-radius:10px;cursor:pointer}.vm-incoming-actions button:first-child{background:#188038;color:#fff}.vm-incoming-actions button:last-child{background:#d93025;color:#fff}@media(max-width:600px){.vm-call-buttons{margin-left:4px}.vm-call-buttons button{padding:7px}.vm-videos{min-height:220px}.vm-videos video#vmLocal{max-width:35%}}</style></head><body><main class="app"><section class="card wide webmail"><header class="topbar"><button id="profileAvatar" class="brand profile-avatar"><span id="myAvatar">VM</span></button><input id="avatarFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden><div><h1>VM</h1><p class="subtitle" id="accountEmail">Carregando...</p><button id="changePhoto" class="photo-link" type="button">📷 Alterar foto</button></div><button id="settingsBtn" class="settings-btn" type="button">⚙️</button><div class="online-pill"><span></span> Online</div></header><div class="chat-layout"><aside class="chat-sidebar"><button id="newChat" class="compose-btn">✏️ Nova conversa</button><input id="userSearch" type="search" placeholder="🔍 Procurar pessoa"><div id="userResults"></div><div class="side-title">Conversas</div><div id="conversations" class="conversation-list"></div><button id="logout" class="secondary logout-btn">Sair</button></aside><section class="chat-main"><div id="emptyChat" class="chat-empty">💬<h2>Suas conversas</h2><p>Escolha uma pessoa para começar.</p></div><div id="chatPanel" hidden><div class="chat-head"><button id="backBtn" class="secondary" type="button">←</button><div id="chatAvatar" class="avatar">VM</div><div><strong id="chatName"></strong><small id="chatEmail"></small></div><span class="chat-status"><i></i> online</span></div><div id="chatMessages" class="chat-messages"></div><form id="chatForm" class="chat-form"><input id="fileInput" type="file" accept="image/*,video/*,audio/*,.pdf,.txt,.doc,.docx,.zip" hidden><button id="attachBtn" class="attach-btn" type="button">📎</button><span id="filePreview" class="file-preview" hidden></span><input id="chatText" maxlength="20000" placeholder="Digite uma mensagem..." autocomplete="off"><button id="sendBtn" type="submit">➤</button></form></div></section></div></section></main><div id="settingsPanel" class="settings-panel" hidden><div class="settings-box"><div class="settings-title"><strong>⚙️ Configurações</strong><button id="settingsClose" type="button">×</button></div><div class="settings-content"><h3>🔔 Notificações</h3><label class="setting-row"><span>Toque<small>Som de novas mensagens</small></span><input id="soundToggle" class="toggle" type="checkbox" checked></label><label class="setting-row"><span>📳 Vibração</span><input id="vibrationToggle" class="toggle" type="checkbox" checked></label><label class="setting-row"><span>🔕 Silencioso</span><input id="silentToggle" class="toggle" type="checkbox"></label><label class="setting-row select-row"><span>🎵 Toque</span><select id="soundSelect"><option value="classic">VM Clássico</option><option value="soft">Suave</option><option value="double">Duplo</option><option value="short">Curto</option></select></label><label class="setting-row volume-row"><span>🔊 Volume</span><input id="volumeRange" type="range" min="0" max="100" value="30"></label><button id="testSound" class="test-sound" type="button">▶ Testar toque</button></div></div></div><div id="msnNotice" class="msn-notice" hidden><div id="noticeAvatar" class="notice-avatar">VM</div><div class="notice-body"><strong id="noticeName">Nova mensagem</strong><span id="noticeText"></span></div><button id="noticeClose">×</button></div><script>let currentChat=null,currentUserId=null,pendingAttachment=null,lastSeenMessageId=0;window.vmUnreadChats=new Set;const $=id=>document.getElementById(id);function esc(v){return String(v||'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]||c))}async function api(url,opt={}){opt.credentials='include';const r=await fetch(url,opt);let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'Erro');return d}function avatar(name,a){return a?`<span class="avatar photo-avatar"><img src="${esc(a)}"></span>`:`<span class="avatar">${esc((name||'V').charAt(0).toUpperCase())}</span>`}function msg(m){if(m.subject==='__VM_CALL__')return '';let a='';if(m.attachment_data){let s=esc(m.attachment_data),n=esc(m.attachment_name||'Arquivo'),t=m.attachment_type||'';a=t.startsWith('image/')?`<img class="attachment-image" src="${s}" alt="${n}">`:t.startsWith('video/')?`<video class="attachment-video" controls src="${s}"></video>`:t.startsWith('audio/')?`<audio class="attachment-audio" controls src="${s}"></audio>`:`<a class="attachment-file" href="${s}" download="${n}">📎 ${n}</a>`}return `<div class="bubble ${String(m.sender_id)===String(currentUserId)?'mine':'theirs'}">${m.body?`<div>${esc(m.body)}</div>`:''}${a}<small>${new Date(m.created_at).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</small></div>`}async function init(){try{let d=await api('/api/me');currentUserId=d.user.id;$('accountEmail').textContent=d.user.phone||d.user.email;$('myAvatar').innerHTML=d.user.avatar?`<img src="${esc(d.user.avatar)}">`:esc(d.user.name.charAt(0).toUpperCase());await loadConversations();setInterval(loadConversations,5000);setInterval(checkIncomingCalls,1800)}catch{location.href='/'}}async function loadConversations(){let d=await api('/api/conversations');$('conversations').innerHTML=d.conversations.map(c=>`<button class="conversation ${window.vmUnreadChats.has(c.email)?'vm-new-message':''}" data-email="${esc(c.email)}">${avatar(c.name,c.avatar)}<span class="conv-info"><strong>${esc(c.name)}</strong><small>${esc(c.attachment_name?'📎 '+c.attachment_name:c.body||'')}</small></span>${window.vmUnreadChats.has(c.email)?'<span class="vm-unread-dot" aria-label="Nova mensagem">1</span>':''}</button>`).join('')||'<p class="empty-side">Nenhuma conversa.</p>'}async function openChat(email){window.vmUnreadChats.delete(email);let d=await api('/api/conversations/'+encodeURIComponent(email));currentChat=d.user;$('emptyChat').hidden=true;$('chatPanel').hidden=false;$('chatAvatar').innerHTML=d.user.avatar?`<img class="avatar-img" src="${esc(d.user.avatar)}">`:esc(d.user.name.charAt(0).toUpperCase());$('chatName').textContent=d.user.name;$('chatEmail').textContent=d.user.phone||d.user.email;$('chatMessages').innerHTML=d.messages.map(msg).join('');$('chatMessages').scrollTop=$('chatMessages').scrollHeight;loadConversations()}async function loadUsers(q=''){let d=await api('/api/users?q='+encodeURIComponent(q));$('userResults').innerHTML=d.users.map(u=>`<button class="user-result" data-email="${esc(u.email)}">${avatar(u.name,u.avatar)}<span><strong>${esc(u.name)}</strong><small>${esc(u.phone||u.email)}</small></span></button>`).join('')}$('conversations').onclick=e=>{let b=e.target.closest('.conversation');if(b)openChat(b.dataset.email)};$('userResults').onclick=e=>{let b=e.target.closest('.user-result');if(b){$('userResults').innerHTML='';$('userSearch').value='';openChat(b.dataset.email)}};$('userSearch').oninput=e=>loadUsers(e.target.value);$('newChat').onclick=()=>{$('userSearch').focus();loadUsers('')};function readFile(f){return new Promise((res,rej)=>{let r=new FileReader;r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}$('attachBtn').onclick=()=>$('fileInput').click();$('fileInput').onchange=async e=>{let f=e.target.files[0];if(!f)return;if(f.size>25*1024*1024){alert('Máximo 25 MB.');return}pendingAttachment={data:await readFile(f),name:f.name,type:f.type||'application/octet-stream'};$('filePreview').hidden=false;$('filePreview').textContent='📎 '+f.name};$('chatForm').onsubmit=async e=>{e.preventDefault();if(!currentChat)return;let text=$('chatText').value.trim();if(!text&&!pendingAttachment)return;try{await api('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({recipient:currentChat.email,subject:'Conversa',body:text,attachmentData:pendingAttachment?.data||'',attachmentName:pendingAttachment?.name||'',attachmentType:pendingAttachment?.type||''})});$('chatText').value='';pendingAttachment=null;$('filePreview').hidden=true;$('fileInput').value='';await openChat(currentChat.email)}catch(e){alert(e.message)}};$('logout').onclick=async()=>{await api('/api/logout',{method:'POST'});location.href='/'};$('profileAvatar').onclick=()=>$('avatarFile').click();$('changePhoto').onclick=()=>$('avatarFile').click();$('avatarFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader;r.onload=async()=>{let img=new Image;img.onload=async()=>{let c=document.createElement('canvas');c.width=c.height=240;let x=c.getContext('2d'),s=Math.min(img.width,img.height);x.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,240,240);await api('/api/profile/avatar',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({avatar:c.toDataURL('image/jpeg',.78)})});init()};img.src=r.result};r.readAsDataURL(f)};function checkIncomingCalls(){if(window.vmCallsCheck)window.vmCallsCheck()}$('settingsBtn').onclick=()=>$('settingsPanel').hidden=false;$('settingsClose').onclick=()=>$('settingsPanel').hidden=true;init();</script><script>(function(){const KEY='vmSettings';let cfg={sound:true,vibration:true,silent:false,tone:'classic',volume:30};try{cfg={...cfg,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{}const save=()=>localStorage.setItem(KEY,JSON.stringify(cfg));const els={sound:$('soundToggle'),vibration:$('vibrationToggle'),silent:$('silentToggle'),tone:$('soundSelect'),volume:$('volumeRange'),test:$('testSound'),notice:$('msnNotice'),noticeName:$('noticeName'),noticeText:$('noticeText'),noticeAvatar:$('noticeAvatar')};function sync(){if(els.sound)els.sound.checked=cfg.sound;if(els.vibration)els.vibration.checked=cfg.vibration;if(els.silent)els.silent.checked=cfg.silent;if(els.tone)els.tone.value=cfg.tone;if(els.volume)els.volume.value=cfg.volume}function audio(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const c=window.__vmAudio||(window.__vmAudio=new AC);if(c.state==='suspended')c.resume();const g=c.createGain(),o=c.createOscillator(),v=Math.max(0,Math.min(1,Number(cfg.volume)/100))*0.16;g.gain.setValueAtTime(v,c.currentTime);o.type='sine';o.frequency.setValueAtTime(740,c.currentTime);o.frequency.exponentialRampToValueAtTime(988,c.currentTime+.12);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.16);if(cfg.tone==='double'){setTimeout(()=>audio(),210)}else if(cfg.tone==='short'){g.gain.setValueAtTime(v,c.currentTime);o.stop(c.currentTime+.09)}else if(cfg.tone==='soft'){o.frequency.setValueAtTime(659,c.currentTime)} }catch{}}function notify(name,text,avatar,email){if(cfg.silent)return;if(email)window.vmUnreadChats.add(email);if(els.noticeName)els.noticeName.textContent=name||'Nova mensagem';if(els.noticeText)els.noticeText.textContent=text||'Você recebeu uma nova mensagem.';if(els.noticeAvatar)els.noticeAvatar.innerHTML=avatar?`<img src="${esc(avatar)}">`:'VM';if(els.notice)els.notice.hidden=false;setTimeout(()=>{if(els.notice)els.notice.hidden=true},5000);if(cfg.sound)audio();if(cfg.vibration&&navigator.vibrate)navigator.vibrate([120,70,120]);loadConversations()}window.vmNotify=notify;els.notice?.addEventListener('click',()=>{els.notice.hidden=true});els.test?.addEventListener('click',()=>{if(!cfg.silent)audio()});els.sound?.addEventListener('change',e=>{cfg.sound=e.target.checked;save()});els.vibration?.addEventListener('change',e=>{cfg.vibration=e.target.checked;save()});els.silent?.addEventListener('change',e=>{cfg.silent=e.target.checked;save()});els.tone?.addEventListener('change',e=>{cfg.tone=e.target.value;save()});els.volume?.addEventListener('input',e=>{cfg.volume=Number(e.target.value);save()});sync();let ready=false,last={};async function poll(){try{const d=await api('/api/conversations');for(const c of d.conversations||[]){const id=Number(c.id||0);if(!id)continue;if(ready&&id>(last[c.email]||0)&&String(c.sender_id||'')!==String(currentUserId)&&c.email!==currentChat?.email){notify(c.name,c.body|| (c.attachment_name?'📎 '+c.attachment_name:'Nova mensagem'),c.avatar,c.email)}last[c.email]=Math.max(last[c.email]||0,id)}ready=true}catch{}}poll();setInterval(poll,3000)})();</script><script src="calls.js"></script></body></html>
