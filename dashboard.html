<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caixa de entrada - Meu E-mail</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section class="card wide">
      <div class="brand">✉</div>
      <h1 id="welcome">Minha caixa de entrada</h1>
      <p class="subtitle" id="accountEmail">Carregando conta...</p>
      <div class="toolbar">
        <button id="compose">✍️ Nova mensagem</button>
        <button id="inboxBtn" class="secondary">📥 Entrada <span id="unreadBadge"></span></button>
        <button id="sentBtn" class="secondary">📤 Enviados</button>\n        <button id="trashBtn" class="secondary">🗑️ Lixeira</button>
      </div>
      <p id="status" class="message" hidden></p>\n      <input id="search" type="search" placeholder="🔍 Pesquisar mensagens">

      <div id="composePanel" class="mailbox" hidden>
        <div class="mailbox-head"><strong>Nova mensagem</strong></div>
        <form id="messageForm">
          <input id="recipient" type="email" placeholder="Destinatário" required>
          <input id="subject" maxlength="200" placeholder="Assunto" required>
          <textarea id="body" maxlength="20000" placeholder="Escreva sua mensagem..." required></textarea>
          <button type="submit">Enviar mensagem</button>
        </form>
      </div>

      <div id="readPanel" class="mailbox" hidden>
        <div class="mailbox-head">
          <strong id="readSubject">Mensagem</strong>
          <button id="closeRead" type="button" class="secondary">Fechar</button>
        </div>
        <p id="readMeta" class="subtitle"></p>
        <div id="readBody" style="white-space:pre-wrap"></div>
        <hr>
        <button id="replyBtn" type="button">↩️ Responder</button> <button id="deleteBtn" type="button" class="secondary">🗑️ Excluir</button> <button id="restoreBtn" type="button" class="secondary" hidden>♻️ Restaurar</button> <button id="permanentBtn" type="button" class="secondary" hidden>🗑️ Excluir definitivamente</button>
      </div>

      <div id="listPanel" class="mailbox">
        <div class="mailbox-head"><strong id="folderTitle">Caixa de entrada</strong><span id="count">0 mensagens</span></div>
        <div id="messages" class="empty">📭<br><strong>Nenhuma mensagem ainda</strong></div>
      </div>

      <button id="logout" class="secondary">Sair</button>
    </section>
  </main>
  <script>
    let currentFolder = 'inbox';
    let currentMessage = null;
    let currentUser = null;
    const statusEl = document.getElementById('status');

    function showStatus(text, error = false) {
      statusEl.textContent = text;
      statusEl.className = 'message ' + (error ? 'error' : 'success');
      statusEl.hidden = false;
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    async function loadAccount() {
      const response = await fetch('/api/me', { credentials: 'include' });
      if (!response.ok) return location.href = '/';
      const data = await response.json();
      currentUser = data.user;
      document.getElementById('welcome').textContent = 'Olá, ' + data.user.name;
      document.getElementById('accountEmail').textContent = data.user.email;
      loadMessages();
    }

    async function loadUnreadCount() {
      const response = await fetch('/api/messages/unread-count', { credentials: 'include' });
      if (!response.ok) return;
      const data = await response.json();
      document.getElementById('unreadBadge').textContent = data.count ? ' (' + data.count + ')' : '';
    }

    async function loadMessages() {
      document.getElementById('readPanel').hidden = true;
      document.getElementById('listPanel').hidden = false;
      const endpoint = currentFolder === 'inbox' ? '/api/messages/inbox' : currentFolder === 'sent' ? '/api/messages/sent' : '/api/messages/trash';
      const query = currentFolder === 'trash' ? '' : '?q=' + encodeURIComponent(document.getElementById('search').value.trim());\n      const response = await fetch(endpoint + query, { credentials: 'include' });
      const data = await response.json();
      if (!response.ok) return showStatus(data.error || 'Não foi possível carregar.', true);

      const list = data.messages || [];
      loadUnreadCount();
      document.getElementById('folderTitle').textContent = currentFolder === 'inbox' ? 'Caixa de entrada' : currentFolder === 'sent' ? 'Enviados' : 'Lixeira';
      document.getElementById('count').textContent = list.length + (list.length === 1 ? ' mensagem' : ' mensagens');
      const container = document.getElementById('messages');

      if (!list.length) {
        container.className = 'empty';
        container.innerHTML = '📭<br><strong>Nenhuma mensagem ainda</strong>';
        return;
      }

      container.className = 'message-list';
      container.innerHTML = list.map(m => {
        const person = currentFolder === 'inbox' ? (m.sender_name || m.sender_email) : (m.recipient_name || m.recipient_email);
        const email = currentFolder === 'inbox' ? m.sender_email : m.recipient_email;
        const unread = currentFolder === 'inbox' && !m.is_read ? ' style="font-weight:bold"' : '';
        return '<article class="mail-item" data-id="' + m.id + '"' + unread + '><strong>' + escapeHtml(person) + '</strong><span>' + escapeHtml(email) + '</span><b>' + escapeHtml(m.subject) + '</b><small>' + new Date(m.created_at).toLocaleString('pt-BR') + '</small></article>';
      }).join('');
    }

    document.getElementById('messages').addEventListener('click', async event => {
      const item = event.target.closest('.mail-item');
      if (!item) return;
      const response = await fetch('/api/messages/' + item.dataset.id, { credentials: 'include' });
      const data = await response.json();
      if (!response.ok) return showStatus(data.error || 'Não foi possível abrir.', true);
      currentMessage = data.message;
      document.getElementById('readSubject').textContent = currentMessage.subject;
      const other = currentFolder === 'inbox'
        ? (currentMessage.sender_name + ' <' + currentMessage.sender_email + '>')
        : ('Para: ' + currentMessage.recipient_name + ' <' + currentMessage.recipient_email + '>');
      document.getElementById('readMeta').textContent = other + ' • ' + new Date(currentMessage.created_at).toLocaleString('pt-BR');
      document.getElementById('readBody').textContent = currentMessage.body;
      document.getElementById('listPanel').hidden = true;
      document.getElementById('readPanel').hidden = false;
      document.getElementById('replyBtn').hidden = currentFolder !== 'inbox';\n      document.getElementById('deleteBtn').hidden = currentFolder === 'trash';\n      document.getElementById('restoreBtn').hidden = currentFolder !== 'trash';\n      document.getElementById('permanentBtn').hidden = currentFolder !== 'trash';
      // A mensagem permanece aberta; a atualização da lista acontece ao fechar ou trocar de pasta.
    });

    document.getElementById('closeRead').onclick = () => {
      document.getElementById('readPanel').hidden = true;
      document.getElementById('listPanel').hidden = false;
    };

    document.getElementById('deleteBtn').onclick = async () => {
      if (!currentMessage || !confirm('Excluir esta mensagem da sua caixa?')) return;
      const response = await fetch('/api/messages/' + currentMessage.id, { method: 'DELETE', credentials: 'include' });
      if (!response.ok) return showStatus('Não foi possível excluir.', true);
      showStatus('Mensagem excluída.');
      currentMessage = null;
      document.getElementById('readPanel').hidden = true;
      document.getElementById('listPanel').hidden = false;
      loadMessages();
    };

    document.getElementById('restoreBtn').onclick = async () => {
      if (!currentMessage) return;
      const response = await fetch('/api/messages/' + currentMessage.id + '/restore', { method: 'POST', credentials: 'include' });
      if (!response.ok) return showStatus('Não foi possível restaurar.', true);
      showStatus('Mensagem restaurada.');
      currentFolder = 'inbox';
      loadMessages();
    };
    document.getElementById('permanentBtn').onclick = async () => {
      if (!currentMessage || !confirm('Excluir definitivamente da sua lixeira?')) return;
      const response = await fetch('/api/messages/' + currentMessage.id + '/permanent', { method: 'DELETE', credentials: 'include' });
      if (!response.ok) return showStatus('Não foi possível excluir.', true);
      showStatus('Mensagem removida da lixeira.');
      document.getElementById('readPanel').hidden = true;
      document.getElementById('listPanel').hidden = false;
      loadMessages();
    };

    document.getElementById('replyBtn').onclick = () => {
      if (!currentMessage) return;
      document.getElementById('readPanel').hidden = true;
      document.getElementById('composePanel').hidden = false;
      recipient.value = currentMessage.sender_email;
      subject.value = currentMessage.subject.startsWith('Re:') ? currentMessage.subject : 'Re: ' + currentMessage.subject;
      body.focus();
    };

    document.getElementById('compose').onclick = () => {
      document.getElementById('composePanel').hidden = false;
      recipient.focus();
    };

    document.getElementById('inboxBtn').onclick = () => { currentFolder = 'inbox'; loadMessages(); };
    document.getElementById('sentBtn').onclick = () => { currentFolder = 'sent'; loadMessages(); };\n    document.getElementById('trashBtn').onclick = () => { currentFolder = 'trash'; loadMessages(); };\n    document.getElementById('search').addEventListener('input', () => { if (currentFolder !== 'trash') loadMessages(); });

    document.getElementById('messageForm').addEventListener('submit', async e => {
      e.preventDefault();
      const payload = { recipient: recipient.value.trim(), subject: subject.value.trim(), body: body.value.trim() };
      const response = await fetch('/api/messages', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        credentials:'include',
        body: JSON.stringify(payload)
      });
      const data = await response.json();
      if (!response.ok) return showStatus(data.error || 'Não foi possível enviar.', true);
      showStatus('Mensagem enviada com sucesso.');
      e.target.reset();
      document.getElementById('composePanel').hidden = true;
      currentFolder = 'sent';
      loadMessages();
    });

    document.getElementById('logout').onclick = async () => {
      await fetch('/api/logout', { method: 'POST', credentials: 'include' });
      location.href = '/';
    };

    loadAccount();
  </script>
</body>
</html>
