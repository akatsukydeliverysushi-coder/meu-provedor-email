<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>VM — Entrar</title>
<link rel="stylesheet" href="style.css?v=20260908-login2">
</head>
<body class="login-page">
<main class="login-app">
  <section class="login-card">
    <div class="login-brand">
      <div class="login-brand-icon">💬</div>
      <div>
        <h1>VM</h1>
        <p>Mensagens simples, rápidas e privadas</p>
      </div>
    </div>
    <div class="login-heading">
      <h2>Bem-vindo de volta</h2>
      <span>Entre na sua conta para continuar conversando.</span>
    </div>
    <div id="message" class="message login-message" hidden></div>
    <form id="loginForm" class="login-form">
      <label for="identifier">Telefone</label>
      <div class="login-input-wrap"><span>📱</span><input id="identifier" type="tel" inputmode="tel" placeholder="(11) 99999-9999" autocomplete="tel" required></div>
      <label for="password">Senha</label>
      <div class="login-input-wrap"><span>🔒</span><input id="password" type="password" placeholder="Digite sua senha" autocomplete="current-password" required></div>
      <button class="login-submit" type="submit">Entrar <span>➜</span></button>
    </form>
    <div class="login-divider"><span>ou</span></div>
    <button id="createAccount" class="login-create" type="button"><span>📱</span> Criar minha conta</button>
    <p class="login-footer">VM Messenger • Converse com quem importa</p>
  </section>
</main>
<script src="app.js?v=20260908-login2" defer></script>
</body>
</html>
