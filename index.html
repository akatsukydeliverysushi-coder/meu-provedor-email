<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>VM</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><section class="card"><div class="brand">💬</div><h1>VM</h1><p class="subtitle">Entre para conversar</p><div id="message" class="message" hidden></div><form id="loginForm"><label for="identifier">Telefone</label><input id="identifier" type="tel" inputmode="tel" placeholder="(11) 99999-9999" autocomplete="tel" required><label for="password">Senha</label><input id="password" type="password" placeholder="Sua senha" autocomplete="current-password" required><button type="submit">Entrar</button></form><div class="divider"><span>ou</span></div><button id="createAccount" class="secondary" type="button">📱 Criar minha conta</button></section></main><script src="app.js"></script></body></html>
